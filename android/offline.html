<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeafForge Studio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0e14;
        color: #e6ebf5;
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
        padding: 32px;
      }
      h1 { font-size: 20px; }
      p { color: #96a1b8; max-width: 30em; }
      button {
        margin-top: 18px;
        background: #2fbf5f;
        border: 0;
        color: #05180c;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>LeafForge Studio could not start</h1>
      <p>
        The studio needs a device with WebGL enabled. Reinstall the app, or open it in a recent
        version of Chrome from the same device.
      </p>
      <button onclick="location.href='index.html'">Try again</button>
    </div>
  </body>
</html>
