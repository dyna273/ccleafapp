name: Deploy to GitHub Pages

# Publishes the static site in dist/ to GitHub Pages.
#
# One-time setup (repo owner, ~30 seconds):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that every push listed below rebuilds and republishes automatically.
#
# The site is served from https://<owner>.github.io/<repo>/ , so every asset
# URL is relative (vite `base: './'`) - verified to work from a subpath.

on:
  push:
    branches:
      - main
      # this session's working branch, so previews go live before the merge
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; queue rather than cancel so a half-finished
# deployment never leaves the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      # sanity check: the entry point and the sample models must be there
      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/models/steve.bbmodel || (echo "sample models missing" && exit 1)
          echo "build output:" && ls -la dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
